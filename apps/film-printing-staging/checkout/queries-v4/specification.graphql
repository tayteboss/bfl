query PreparedSpecificationInput($deadline: DateTimeWithoutTimezone!) {
  buyerJourney { step }
  leaseOwner: validation { lease: metafield(namespace: "$app:bfl-checkout", key: "lease_v3") { value } }
  shop { localTime { beforeDeadline: dateTimeBefore(dateTime: $deadline) } }
  cart {
    binding: metafield(namespace: "$app:bfl-checkout", key: "binding_v2") { value }
    buyerIdentity { isAuthenticated customer { id } }
    lines { id quantity merchandise { ... on ProductVariant { id product { id } } }
      sellingPlanAllocation { __typename }
      cost { amountPerQuantity { currencyCode } }
      flow: attribute(key: "_bfl_flow") { value }
      job: attribute(key: "_bfl_job") { value }
      revision: attribute(key: "_bfl_revision") { value }
      config: attribute(key: "_bfl_config") { value }
      signature: attribute(key: "_bfl_signature") { value }
      size_mode: attribute(key: "_bfl_size_mode") { value }
      width: attribute(key: "Custom Width") { value }
      height: attribute(key: "Custom Height") { value }
      process: attribute(key: "Process") { value }
      scanning: attribute(key: "Scanning Options") { value }
      negatives: attribute(key: "Negatives") { value }
    }
    deliveryGroups { cartLines { id } selectedDeliveryOption { deliveryMethodType } }
  }
}
